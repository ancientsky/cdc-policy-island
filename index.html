<!doctype html>
<html lang="zh-Hant" data-theme="morning">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e3c8">
  <title>防疫島大冒險｜台灣防疫互動地圖（非官方）</title>
  <meta name="description" content="病菌想登陸台灣？跟著防疫小隊長琵琵巡邏 14 座島，看醫生、檢驗員和里長伯怎麼接力把病菌擋下來。依疾管署公開資料整理的非官方互動地圖。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>
<body>
  <div id="view">
    <canvas id="c" aria-label="十四座島排成臺灣的形狀。完整說明在清單裡。"></canvas>
  </div>
  <div class="hud">
    <header class="brand">
      <strong id="brand-title">防疫島大冒險</strong>
      <span id="badge" class="badge" title="本站非疾病管制署官方網站，內容依公開資料整理" aria-label="本站非疾病管制署官方網站，內容依公開資料整理">非官方</span>
      <nav class="tools" aria-label="地圖">
        <button id="home" type="button" class="btn">看全島</button>
        <button id="bird" type="button" class="btn btn--icon" data-toggle="bird" aria-pressed="false" aria-label="鳥瞰"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 12c2.4-4 5.2-6 9-6s6.6 2 9 6c-2.4 4-5.2 6-9 6s-6.6-2-9-6z"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg></button>
        <button id="list" type="button" class="btn" aria-expanded="false">清單</button>
        <button id="sound" type="button" class="btn btn--icon" aria-pressed="true" aria-label="音效"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9.5h3.2L12 5.2v13.6l-4.8-4.3H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.2 9.2a3.6 3.6 0 0 1 0 5.6M17.6 7a6.4 6.4 0 0 1 0 10"/></svg></button>
        <button id="help" type="button" class="btn btn--icon" aria-label="操作說明">?</button>
        <button id="view-btn" type="button" class="btn btn--icon" aria-expanded="false" aria-haspopup="true" aria-label="顯示"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 3.2v2.2M12 18.6v2.2M3.2 12h2.2M18.6 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/></svg></button>
        <button id="lang-btn" type="button" class="btn" aria-haspopup="true" aria-expanded="false">中 ▾</button>
      </nav>
      <div id="lang-pop" class="pop" hidden></div>
    </header>
    <div id="view-menu" class="pop view-menu" hidden>
      <button type="button" class="btn" data-toggle="names" aria-pressed="true">島名</button>
    </div>
    <section id="chapter" class="chapter" hidden>
      <div class="chapter-face" id="chapter-face">琵</div>
      <div class="chapter-copy">
        <h2 id="chapter-title"></h2>
        <p id="chapter-body"></p>
      </div>
    </section>
    <p id="disclaimer-short" class="disclaimer-short">非官方網站・依疾管署公開資料整理</p>
    <div class="title-card" id="title-card">
      <h1 id="hero-title">病菌想登陸台灣？<br>先過這 14 座島！</h1>
      <p id="hero-lead">每座島都有一群人在守門。<br>點一座島，看他們怎麼接力擋病菌。</p>
    </div>
    <nav class="rail" id="rail" aria-label="島嶼"></nav>
    <aside class="ledger" id="ledger" aria-label="島嶼任務清單" data-pane="life">
      <div class="ledger-head">
        <p id="disclaimer-peek" class="disclaimer-peek">非官方網站・依疾管署公開資料整理</p>
        <p class="stats" id="stats"></p>
        <input id="search" type="search" placeholder="搜尋：蚊子、疫苗、洗手…" aria-label="搜尋島、蚊子、疫苗、洗手">
        <div class="tabs" role="tablist">
          <button type="button" class="btn on" data-tab="life" id="tab-life" aria-selected="true">我想知道…</button>
          <button type="button" class="btn" data-tab="islands" id="tab-islands" aria-selected="false">全部的島</button>
          <button type="button" class="btn" data-tab="flows" id="tab-flows" aria-selected="false">運送路線 18</button>
          <button type="button" class="btn" data-tab="log" id="tab-log" aria-selected="false">送貨紀錄</button>
          <button type="button" class="btn only-narrow" data-tab="phase" id="tab-phase" aria-selected="false">時間</button>
          <button type="button" class="btn only-narrow" data-tab="pillar" id="tab-pillar" aria-selected="false">小隊</button>
        </div>
        <button type="button" id="fact-tick" class="fact-tick"><b></b><span></span></button>
      </div>
      <div class="ledger-scroll">
        <div id="tree" class="tree"></div>
        <footer class="legal">
          <span id="data-as-of">資料截至 2026-10</span>
          <button type="button" class="btn btn--sm" id="about">關於這張地圖</button>
          <a id="source-link" href="https://www.cdc.gov.tw/Category/MPage/kVzFWokFW3l9_YeB8idzuw" target="_blank" rel="noopener noreferrer">資料來源</a>
        </footer>
      </div>
    </aside>
    <article class="sheet" id="sheet" hidden aria-live="polite"></article>
    <p class="caption" id="caption"><i class="caption-face" id="caption-face" aria-hidden="true"></i><span class="caption-text"><span id="day-note"></span> <span id="status" aria-live="polite"></span></span></p>
    <section class="dial" aria-label="時間與篩選">
      <button id="play" type="button" class="btn btn--icon btn--solid" aria-pressed="false" aria-label="快轉一天">▶</button>
      <output id="clock">08:20</output>
      <div class="track">
        <input id="day" type="range" min="0" max="1439" value="500" aria-label="防疫的一天，以分鐘計">
        <div class="ticks" id="chapter-ticks"></div>
      </div>
      <button id="route" type="button" class="btn" data-toggle="flows" aria-pressed="false">運送路線</button>
      <button id="filter" type="button" class="btn" aria-expanded="false" aria-haspopup="true">篩選</button>
    </section>
    <div id="filter-pop" class="pop filter-pop" hidden>
      <p class="filter-kicker" id="phase-kicker">從現在到 2035</p>
      <div class="choices" id="phase-buttons"></div>
      <p class="note" id="phase-note"></p>
      <p class="filter-kicker" id="pillar-kicker">五支小隊</p>
      <div class="choices pills" id="pillar-buttons"></div>
      <p class="note" id="pillar-note">可以選好幾隊。都不選，就看全部 14 座島。</p>
    </div>
    <div class="compass" title="北方">
      <div id="compass-rose"><b>北</b><i></i></div>
    </div>
    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="false" aria-labelledby="modal-title" aria-describedby="modal-body">
        <p class="eyebrow" id="modal-kicker"></p>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <div class="modal-actions">
          <span class="dots" id="modal-dots" aria-hidden="true"></span>
          <span class="modal-buttons">
            <button id="modal-skip" type="button" class="btn">略過</button>
            <button id="modal-next" type="button" class="btn btn--solid">下一步</button>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="veil" id="veil"><p id="veil-text">琵琵隊長正在巡島，馬上就好…</p></div>
  <pre id="diag" hidden></pre>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
